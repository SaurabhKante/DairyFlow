# ─────────────────────────────────────────────────────────────
#  MilkMist — Docker Compose (HTTPS & Nginx Reverse Proxy)
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL Database ────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: milkmist_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-milkmistdb}
      MYSQL_USER: ${DB_USER:-milkmist_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-milkmist_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./milkmistdb.sql:/docker-entrypoint-initdb.d/milkmistdb.sql:ro
    networks:
      - milkmist_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Node.js Backend ───────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: milkmist_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_USER: ${DB_USER:-milkmist_user}
      DB_PASSWORD: ${DB_PASSWORD:-milkmist_pass}
      DB_NAME: ${DB_NAME:-milkmistdb}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-25d}
    # Port 3000 is intentionally NOT exposed to the internet anymore for security.
    # Nginx securely proxies traffic to this backend over the internal Docker network.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - milkmist_net

  # ── React Frontend (Nginx HTTPS Reverse Proxy) ────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    container_name: milkmist_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount shared volumes for SSL certificates
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - milkmist_net

# ── Named Volumes ─────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ── Networks ──────────────────────────────────────────────
networks:
  milkmist_net:
    driver: bridge
